[package]
name = "apriori_window_md"
version = "0.1.0"
edition = "2021"

[lib]
name = "apriori_window_md"
path = "src/lib.rs"

[[bin]]
name = "md_pipeline"
path = "src/bin/md_pipeline.rs"

[dependencies]
itertools = "0.14"
new_apriori_window = { path = "../apriori_window_1d" }
rand = "0.8"
rand_distr = "0.4"
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"
